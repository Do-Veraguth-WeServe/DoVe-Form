<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Form — lokal denken</title><style>
:root{color-scheme:dark;--bg:#141718;--ink:#e9e9de;--muted:#9ca49f;--line:#343b38;--lime:#d4ef8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
button,textarea,select,input{font:inherit;color:inherit}button,select{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 13px}
button:hover{border-color:var(--lime);background:#222923}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}button:disabled{opacity:.4;cursor:default}
#model{font-size:12px;padding:7px 10px;background:#1c211e;max-width:230px}
.app{max-width:1480px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);height:100dvh}
aside{border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column;gap:24px}
.brand{font-size:26px;letter-spacing:-1.5px;font-weight:600}.brand span{color:var(--lime);margin-right:12px}
.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sessions{display:grid;gap:8px;overflow:auto}.sessions button{text-align:left;border-color:transparent;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sessions button[aria-current=true]{background:#242b24;color:var(--lime)}
.navtabs{display:flex;gap:6px}.navtabs button{flex:1;font-size:13px;padding:8px}.navtabs [aria-selected=true]{background:#242b24;color:var(--lime)}#elements-list{display:flex;flex-direction:column}#elements-list.hidden{display:none}#elements-list small{color:var(--muted);font-size:12px}
.sidebottom{margin-top:auto;color:var(--muted);font-size:12px}.sidebottom code{color:var(--ink)}
.tools{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.tools button{font-size:12px}
main{min-width:0;display:flex;flex-direction:column;height:100dvh}
header{height:80px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 42px;border-bottom:1px solid var(--line)}
.status{font:11px ui-monospace,monospace;color:var(--muted);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status b{color:var(--lime)}
#mobile{display:none}#settingsbtn{padding:8px 13px}
.feed{flex:1;overflow:auto;scrollbar-color:#4b554a transparent;padding:35px max(28px,calc((100% - 860px)/2));scroll-behavior:auto;overflow-anchor:none}
.intro{padding:18px 0 32px}.intro h1{font-size:clamp(32px,5vw,55px);line-height:1.12;letter-spacing:-2px;font-weight:450;max-width:650px;margin:18px 0}.intro h1 em{font-family:Georgia,serif;font-weight:400;color:var(--lime)}.intro p{color:var(--muted);max-width:530px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin-top:25px}.starters button{font-size:12px}
.empty{border:1px dashed #4a554a;border-radius:12px;padding:26px;margin:22px 0;max-width:660px}.empty h2{font-weight:500;margin:10px 0}.empty p{color:var(--muted)}.empty code{color:var(--ink)}
.message{margin:14px 0 30px}.user{display:flex;justify-content:flex-end}
.bubble{background:#2b322b;border:1px solid #3c453b;padding:13px 19px;border-radius:17px 17px 3px 17px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.byline{display:flex;align-items:center;gap:10px;font:11px ui-monospace,monospace;color:var(--muted);margin:18px 0}.byline span{color:var(--lime);font-size:20px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:760px;margin:4px 0 12px}
.render{width:100%;border:0;display:block;background:transparent;min-height:200px}
.notice{border-left:2px solid var(--lime);padding:12px 16px;color:var(--muted);margin:15px 0}.error{border-color:#edaa9d}
.small{font-size:12px;color:var(--muted)}
.sketch{display:flex;justify-content:center;padding:22px 0}.sketch svg{width:130px;height:72px;color:#899b6b}
.sketch path,.sketch circle,.sketch line,.sketch polygon{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.7s ease-in-out infinite alternate}
@keyframes draw{to{stroke-dashoffset:0}}
/* Phase 1 „Denken": wachsendes ⌑-Drahtgitter */
.think{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 0 2px}
.think .thinklabel{font:11px ui-monospace,monospace;color:var(--muted);letter-spacing:1px}
.think.compact{flex-direction:row;align-items:center;padding:2px 0}
@keyframes edgegrow{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
/* Phase 2 „Schreiben”: der streamende Text ist die Bewegung; Cursor-Puls */
.prose.writing::after{content:'▍';color:var(--lime);animation:caret 1s steps(2) infinite;margin-left:1px}
@keyframes caret{50%{opacity:0}}
/* Phase 3 „Bauen”: erkennbare kleine Baustelle im künftigen Element-Container */
.site{border:1px solid var(--line);border-radius:12px;background:#181d1a;padding:14px 16px;margin:10px 0;max-width:760px}
.site .crane{display:block;width:min(240px,100%);height:auto;color:#899b6b;margin:0 auto}
.site .ground{stroke:currentColor;stroke-width:2;stroke-linecap:round}
.site .scaffold line{stroke:#6d7a63;stroke-width:1.2}
.site .block{fill:#8fa6a1;stroke:none;transform-box:fill-box;transform-origin:center;animation:blockset .9s cubic-bezier(.34,1.56,.64,1) both}
.site .b2{animation-delay:.4s}.site .b3{animation-delay:.9s}
@keyframes blockset{from{opacity:0;transform:translateY(-7px) scale(.7)}to{opacity:1;transform:none}}
.site .trolley{animation:cranesway 5.2s ease-in-out infinite alternate}

.site .load{fill:#d4ef8b;stroke:none;animation:lower 5.2s ease-in-out infinite alternate}
@keyframes cranesway{0%{transform:translateX(-14px)}100%{transform:translateX(10px)}}
@keyframes lower{0%{transform:translateY(-8px)}100%{transform:translateY(10px)}}
.sitemeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.sitelabel{font:11px ui-monospace,monospace;color:var(--lime);letter-spacing:1px}
.sitephase{color:var(--muted)}
.sitemeta button{font-size:11px;padding:5px 10px}
.site.failed{border-color:#6b4a42}.site.failed .sitephase{color:#edaa9d}
.site.cancelled{opacity:.75}
.composer-wrap{padding:12px max(28px,calc((100% - 860px)/2)) 20px;background:var(--bg)}
.quickbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.qchip{flex:0 0 auto;font-size:12px;padding:6px 11px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.refchip{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding:6px 12px;border:1px dashed var(--lime);border-radius:9px;font-size:12px;color:var(--lime)}
.refchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refchip button{padding:3px 8px;font-size:11px}
.elhead{display:flex;align-items:center;gap:6px;margin:2px 0 6px}
.elname{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink);max-width:min(60vw,340px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elname[aria-pressed=true]{border-color:var(--lime);color:var(--lime)}
button.icon{padding:5px 9px;font-size:13px}
.elwrap{border-radius:12px}
.elwrap.marked{outline:2px solid var(--lime);outline-offset:6px}
.updated{animation:pulse 1.8s ease-out 1}
@keyframes pulse{0%{background:#242e1d}100%{background:transparent}}
#overlay{background:var(--bg);border:0;box-shadow:none;max-width:none;width:min(96vw,1100px);height:min(92dvh,900px)}
.ovdlg{display:flex;flex-direction:column;height:100%;padding:18px 20px;min-height:0;overflow:hidden}
.ovhead{display:flex;align-items:center;gap:10px;flex-shrink:0}.ovhead strong{flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovbody{flex:1;min-height:0;overflow:auto;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.ovfoot{display:flex;gap:8px;flex-wrap:wrap}
.ovfoot button{font-size:13px}
.codeed{display:grid;gap:8px}
.codeed label{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.codeed textarea,.codeed input{width:100%;background:#141718;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}
.codeed textarea{font:12px/1.45 ui-monospace,monospace}
.vlist{display:grid;gap:8px}
.verow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px}
.verow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{display:flex;align-items:flex-end;gap:10px;padding:12px;border:1px solid #505a4a;border-radius:14px;background:#1c211e}
.composer textarea{resize:none;flex:1;min-width:0;background:none;border:0;outline:0;padding:8px;max-height:130px}
.send{background:var(--lime);color:#1e2816;border:0;min-width:44px}.send:disabled{background:#3a423a;color:#8a928a}
.hint{font-size:10px;color:var(--muted);text-align:center;margin-top:9px}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);max-width:90vw;background:#d4ef8b;color:#172010;padding:12px 20px;border-radius:8px;z-index:30}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.hidden{display:none!important}
dialog{border:1px solid var(--line);background:#1c211e;color:var(--ink);border-radius:14px;padding:0;max-width:580px;width:calc(100vw - 40px);margin:auto}
dialog::backdrop{background:rgba(10,12,11,.7)}
.dlg{padding:26px}.dlghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dlghead strong{font-size:18px}
#modellist{display:grid;gap:8px;margin:16px 0}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.mrow strong{display:block;font-size:14px}.mrow button{font-size:11px;padding:6px 10px}
#addmodel{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
#addmodel label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
#addmodel input{background:#141718;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink)}
#loginform,#regform{display:grid;gap:10px;margin-top:14px}
#loginform label,#regform label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
#loginform input,#regform input{background:#141718;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink)}
#importbar button{font-size:11px;padding:6px 10px}
#importbar span{flex:1;white-space:normal}
@media(max-width:760px){.app{display:block}aside{display:none;position:fixed;inset:65px 0 0 0;background:#141718;z-index:10;padding:25px}aside.open{display:flex}header{height:65px;padding:0 20px;gap:8px}header>div:first-child{display:none}header>div:nth-child(2){flex:1;min-width:0}#mobile{display:block;flex-shrink:0;margin-left:auto}#model{max-width:120px}.feed{padding:22px 20px}.composer-wrap{padding:10px 16px max(12px,env(safe-area-inset-bottom))}.intro{padding-top:10px}.intro h1{letter-spacing:-1px}.hint{font-size:9px}.elname{max-width:52vw}#overlay{width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}.site{padding:10px 12px}.site .crane{width:min(240px,100%)}.think svg{width:100px;height:55px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}.sketch path,.sketch circle,.sketch line,.sketch polygon{stroke-dashoffset:0}.think .wire line{opacity:1;transform:none}.site .block,.site .trolley,.site .load{animation:none!important;opacity:1;transform:none}}
</style></head><body><div class="app"><aside id="sidebar"><div class="brand"><span>⌑</span>form</div><button id="new">＋ Neuer Chat</button><div class="navtabs" role="tablist" aria-label="Sammlungen"><button id="elements-tab" role="tab" aria-selected="false" aria-controls="elements-list">Elemente</button><button id="chats-tab" role="tab" aria-selected="true" aria-controls="sessions">Chats</button></div><nav class="sessions hidden" id="elements-list" role="tabpanel" aria-labelledby="elements-tab"></nav><nav class="sessions" id="sessions" role="tabpanel" aria-labelledby="chats-tab" aria-label="Gespeicherte Chats"></nav><div class="sidebottom"><div class="tools"><button id="settingsbtn2">Modelle</button><button id="mcpbtn">Verbindungen</button><button id="logout">Abmelden</button></div><p><span id="whoami"></span></p></div></aside><main><header><div style="display:flex;align-items:center;gap:15px"><span>Form</span></div><div style="display:flex;align-items:center;gap:12px"><select id="model" class="hidden" aria-label="Modell wählen"></select><button id="settingsbtn" aria-label="Modelle verwalten">⚙</button><span class="status"><b>●</b> <span id="statuslabel">STARTET</span></span></div><button id="mobile" aria-label="Sitzungen öffnen" aria-expanded="false">☰</button></header><div id="feed" class="feed" tabindex="0" aria-label="Gespräch"></div><div class="composer-wrap"><div id="quickbar" class="quickbar hidden" aria-label="Angepinnte Elemente"></div><div id="refchip" class="refchip hidden"></div><form id="composer" class="composer"><textarea id="prompt" rows="1" maxlength="2000" aria-label="Nachricht" placeholder="Nachricht …"></textarea><button class="send" id="send" aria-label="Nachricht senden">↑</button><button type="button" id="stop" class="hidden">Stoppen</button></form><div id="live" class="sr-only" aria-live="polite"></div></div></main></div><dialog id="login" aria-label="Anmeldung"><div class="dlg"><div class="dlghead"><strong>Form · Anmelden</strong></div><div id="loginerr" class="notice error hidden"></div><form id="loginform"><label>Benutzername <input name="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>Passwort <input name="password" type="password" required autocomplete="current-password"></label><button>Anmelden</button></form><form id="regform" class="hidden"><label>Benutzername <input name="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>Passwort <input name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password"></label><label>Passwort wiederholen <input name="password2" type="password" required minlength="8" maxlength="200" autocomplete="new-password"></label><button>Registrieren</button></form><div class="ovfoot" style="margin-top:14px"><button id="switchreg" class="hidden">Neu registrieren</button></div></div></dialog><dialog id="settings" aria-label="Modelle verwalten"><div class="dlg"><div class="dlghead"><strong>Modelle</strong><button id="closesettings" aria-label="Einstellungen schliessen">✕</button></div><div id="modellist"></div><form id="addmodel"><div class="eyebrow">Modell hinzufügen</div><label>Bezeichnung <input name="label" required maxlength="60" placeholder="z. B. z.ai"></label><label>Base-URL <input name="baseUrl" required maxlength="200" placeholder="https://api.z.ai/v1"></label><label>Modell-ID <input name="model" required maxlength="100" placeholder="glm-4.6"></label><label>API-Key <input name="apiKey" type="password" required minlength="6" maxlength="400" autocomplete="off"></label><button>Hinzufügen</button></form></div></dialog><dialog id="overlay" aria-label="Elementansicht"><div class="dlg ovdlg" id="ovcontent"></div></dialog><dialog id="mcpdialog" aria-label="MCP-Verbindungen"><div class="dlg"><div class="dlghead"><strong>Verbindungen</strong><button id="mcpclose">✕</button></div><div id="mcplist"></div><form id="mcpadd"><label>Name<input name="name" required maxlength="80"></label><label>MCP-Adresse<input name="url" type="url" required></label><label>Bearer-Token<input name="token" type="password" autocomplete="off"></label><button>Hinzufügen</button></form></div></dialog><div id="toolapprovals" style="position:fixed;bottom:90px;right:16px;z-index:30;max-width:min(420px,90vw);max-height:60vh;overflow:auto"></div></body></html>

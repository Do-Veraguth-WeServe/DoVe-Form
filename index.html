<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Form — Gedanken werden Möglichkeiten</title><style>

</style></head><body><div class="app"><aside id="sidebar"><div class="brand"><span>⌑</span>form</div><button id="new">＋ Neuer Gedankengang</button><div class="eyebrow">Dein Notizraum</div><nav class="sessions" id="sessions" aria-label="Gespeicherte Chats"></nav><div class="sidebottom"><div class="tools"><button id="export">Exportieren</button><button id="import">Importieren</button></div><input id="file" type="file" accept="application/json" hidden><p>Privater Prototyp · lokal gespeichert.<br>Keine KI verbunden. Keine Cloud-Synchronisation.</p><div class="eyebrow">FORM / LAB 001</div></div></aside><main><header><div style="display:flex;align-items:center;gap:15px"><button id="mobile" aria-label="Sitzungen öffnen" aria-expanded="false">☰</button><span>Freiraum für deine Ideen</span></div><span class="status"><b>●</b> INTERAKTIVE DEMO</span></header><div id="feed" class="feed" tabindex="0" aria-label="Gespräch"></div><div class="composer-wrap"><form id="composer" class="composer"><textarea id="prompt" rows="1" maxlength="2000" aria-label="Nachricht" placeholder="Was möchtest du durchdenken?"></textarea><button class="send" id="send" aria-label="Nachricht senden">↑</button><button type="button" id="stop" class="hidden">Stoppen</button></form><div class="hint">Enter senden · Shift + Enter neue Zeile · Interaktive Antworten, keine echten Aktionen</div><div id="live" class="sr-only" aria-live="polite"></div></div></main></div><script>
'use strict';
const $=s=>document.querySelector(s), key='form.prototype.v1', uid=()=>crypto.randomUUID(), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db, pending=null, frames=new Map();

function normalize(x){if(!x||x.version!==1||!Array.isArray(x.sessions)||x.sessions.length>40)throw Error('Ungültiges Format');let sessions=x.sessions.map(s=>{if(typeof s.id!=='string'||typeof s.title!=='string'||!Array.isArray(s.messages)||s.messages.length>100)throw Error('Ungültige Sitzung');return {id:s.id.slice(0,80),title:s.title.slice(0,80),messages:s.messages.map(m=>{if(!m||!['user','assistant'].includes(m.role)||typeof m.id!=='string')throw Error('Ungültige Nachricht');if(m.role==='user'){if(typeof m.text!=='string')throw Error('Ungültiger Text');return {id:m.id.slice(0,80),role:'user',text:m.text.slice(0,2000)}}if(!['calc','compare','plan','fallback','error','stopped'].includes(m.kind))throw Error('Unbekannter Antworttyp');return {id:m.id.slice(0,80),role:'assistant',kind:m.kind,state:cleanState(m.kind,m.state),text:typeof m.text==='string'?m.text.slice(0,2000):''}})}});if(new Set(sessions.map(s=>s.id)).size!==sessions.length)throw Error('Doppelte Sitzungen');return {version:1,sessions,current:sessions.some(s=>s.id===x.current)?x.current:sessions[0]?.id}}
function cleanState(kind,s){s=s||{};return kind==='calc'?{monthly:Math.max(50,Math.min(1000,Number(s.monthly)||250)),years:Math.max(1,Math.min(20,Number(s.years)||10))}:kind==='compare'?{selected:['studio','retreat','city'].includes(s.selected)?s.selected:'studio'}:kind==='plan'?{week:Math.max(0,Math.min(8,Math.floor(Number(s.week)||0))),team:Math.max(1,Math.min(5,Math.floor(Number(s.team)||2)))}:{}}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500);$('#live').textContent=t}
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{toast('Speicher voll oder blockiert. Bitte exportieren.')}}
try{db=normalize(JSON.parse(localStorage.getItem(key)))}catch{db=fresh()}
const current=()=>db.sessions.find(s=>s.id===db.current);
function newSession(){stop();if(db.sessions.length>=40)return toast('Maximal 40 Sitzungen. Exportiere dein Archiv.');let s={id:uid(),title:'Neuer Gedankengang',messages:[]};db.sessions.unshift(s);db.current=s.id;save();render();$('#sidebar').classList.remove('open')}
const sharedCSS='*{box-sizing:border-box}html,body{color-scheme:dark;margin:0;background:#141718;color:#e9e9de;font:15px/1.5 system-ui,sans-serif;overflow:hidden}main{padding:3px 0 18px}h2{font-size:clamp(25px,5vw,35px);font-weight:450;letter-spacing:-1px;line-height:1.2;margin:8px 0 14px}p{color:#a8b0a8;max-width:650px}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:2px;color:#a8b0a8}.accent{color:#d4ef8b}button,input{font:inherit}button{cursor:pointer;color:#e9e9de;background:transparent;border:1px solid #485343;border-radius:7px;padding:11px 15px}button:hover,button[aria-pressed=true]{background:#293325;border-color:#d4ef8b}button:focus-visible,input:focus-visible{outline:2px solid #d4ef8b;outline-offset:3px}button:disabled{opacity:.4}input[type=range]{width:100%;accent-color:#d4ef8b;margin:18px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.big{font-size:clamp(30px,7vw,49px);letter-spacing:-2px}.small{font-size:12px;color:#a8b0a8}.rule{border-top:1px solid #343e34;margin:22px 0}.chart{width:100%;height:180px;display:block}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.choices button{text-align:left;padding:16px 10px}.choices strong{display:block;margin:12px 0}.choices span{font-size:11px;color:#acb6a8}.bar{height:6px;background:#303b2d;border-radius:8px;margin:9px 0 18px;overflow:hidden}.bar i{display:block;background:#d4ef8b;height:100%}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:25px 0}.step{border-top:2px solid #414b3b;padding-top:10px;font-size:12px}.step.done{border-color:#d4ef8b;color:#d4ef8b}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:420px){.choices{gap:6px}.choices button{padding:12px 7px}.choices strong{font-size:13px}.metrics{gap:10px}.steps{gap:5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}';
function content(m){let html='',js='';if(m.kind==='calc'){html='<div class="eyebrow">01 / VERMÖGEN SPIELERISCH VERSTEHEN</div><h2>Kleine Schritte.<br><span class="accent">Mehr Möglichkeiten.</span></h2><p>Was wird aus einem monatlichen Sparbetrag? Verschiebe die Regler und beobachte deinen möglichen Weg.</p><div class="metrics"><div><div class="small">Simulierter Endwert</div><div class="big accent" id="total"></div></div><div><div class="small">Davon selbst eingezahlt</div><div class="big" id="paid"></div></div></div><svg class="chart" viewBox="0 0 600 180" role="img" aria-label="Sparentwicklung über die gewählte Laufzeit"><path d="M0 45H600M0 100H600M0 155H600" stroke="#30392f" fill="none"/><path id="area" fill="#d4ef8b12"/><path id="line" stroke="#d4ef8b" stroke-width="3" fill="none"/><path id="base" stroke="#899a7c" stroke-dasharray="5 6" fill="none"/></svg><div class="row small"><span>Heute</span><span id="end"></span></div><div class="rule"></div><label for="monthly" class="row">Monatlicher Betrag <strong id="monthLabel"></strong></label><input id="monthly" type="range" min="50" max="1000" step="50"><label for="years" class="row">Zeithorizont <strong id="yearLabel"></strong></label><input id="years" type="range" min="1" max="20"><p class="small">Illustration mit 5 % p.a., monatlicher Verzinsung. Keine Gebühren, Steuern oder Inflation. Keine Prognose oder Finanzberatung.</p>';js="function draw(){let n=state.years*12,r=.05/12,paid=state.monthly*n,total=state.monthly*((1+r)**n-1)/r;let fmt=v=>new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF',maximumFractionDigits:0}).format(v);q('total').textContent=fmt(total);q('paid').textContent=fmt(paid);q('monthLabel').textContent=fmt(state.monthly);q('yearLabel').textContent=state.years+' Jahre';q('end').textContent='In '+state.years+' Jahren';let pts=Array.from({length:31},(_,i)=>[i*20,160-145*(state.monthly*((1+r)**(n*i/30)-1)/r)/total]);let d=pts.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');q('line').setAttribute('d',d);q('area').setAttribute('d',d+' L600,160 L0,160Z');q('base').setAttribute('d','M0,160 L600,'+(160-145*paid/total));}for(let k of ['monthly','years']){q(k).value=state[k];q(k).oninput=()=>{state[k]=+q(k).value;draw();persist()}}draw();"}
else if(m.kind==='compare'){html='<div class="eyebrow">02 / ENTSCHEIDUNGEN SICHTBAR MACHEN</div><h2>Ein Ort für deinen<br><span class="accent">nächsten grossen Gedanken.</span></h2><p>Drei fiktive Arbeitsorte, drei unterschiedliche Qualitäten. Wähle einen und entdecke, was zu dir passt.</p><div class="choices"><button data-choice="studio"><span>01 / RUHE</span><strong>Waldstudio</strong><span>CHF 180 / Tag</span></button><button data-choice="retreat"><span>02 / WEITE</span><strong>Berghütte</strong><span>CHF 240 / Tag</span></button><button data-choice="city"><span>03 / AUSTAUSCH</span><strong>Stadtatelier</strong><span>CHF 120 / Tag</span></button></div><h2 id="choiceTitle"></h2><p id="desc"></p><div id="scores"></div><button id="suggest">Diesen Gedanken weiterführen ↗</button><p class="small">Beispieldaten · keine Buchung, keine externe Aktion.</p>';js="let options={studio:['Weniger Ablenkung. Mehr Tiefe.','Ein stilles Studio am Waldrand. Für konzentriertes Schreiben, Entwerfen und Nachdenken.',[95,40,70]],retreat:['Abstand öffnet neue Perspektiven.','Zwei Tage in den Bergen. Für Strategie, einen Neustart und einen klaren Kopf.',[90,65,45]],city:['Gute Ideen treffen aufeinander.','Ein offenes Atelier mitten in der Stadt. Für Austausch, Workshops und spontane Begegnungen.',[50,95,90]]};function draw(){let o=options[state.selected];q('choiceTitle').textContent=o[0];q('desc').textContent=o[1];q('scores').innerHTML=o[2].map((v,i)=>'<div class=\"row small\"><span>'+['Fokus','Austausch','Erreichbarkeit'][i]+'</span><span>'+v+'/100</span></div><div class=\"bar\"><i style=\"width:'+v+'%\"></i></div>').join('');document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.choice===state.selected))}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.choice;draw();persist()});q('suggest').onclick=()=>send('suggest',{text:'Plane einen kreativen Tag: '+state.selected});draw();"}
else if(m.kind==='plan'){html='<div class="eyebrow">03 / IDEEN IN BEWEGUNG</div><h2>Von der Skizze<br><span class="accent">zum ersten Release.</span></h2><p>Eine kleine Projektsimulation. Verändere die Teamgrösse, gehe Woche für Woche vorwärts und beobachte Aufwand und Fortschritt.</p><label class="row" for="team">Menschen im Team <strong id="teamLabel"></strong></label><input id="team" type="range" min="1" max="5"><div class="metrics"><div><div class="small">Simulierter Fortschritt</div><div class="big accent" id="progress"></div></div><div><div class="small">Personentage investiert</div><div class="big" id="effort"></div></div></div><div class="bar"><i id="fill"></i></div><div class="steps"><div class="step">01<br>Entdecken</div><div class="step">02<br>Entwerfen</div><div class="step">03<br>Umsetzen</div><div class="step">04<br>Testen</div></div><p id="weekText"></p><div class="actions"><button id="advance">Nächste Woche →</button><button id="reset">Zurücksetzen</button></div><p class="small">Deterministisches Lernmodell · keine echte Projektprognose. Teamwechsel berechnet die gesamte Simulation neu.</p>';js="function draw(){let p=Math.min(100,Math.round(state.week*(8+state.team*3)));q('teamLabel').textContent=state.team;q('progress').textContent=p+' %';q('effort').textContent=state.week*state.team*5;q('fill').style.width=p+'%';q('weekText').textContent='Woche '+state.week+' / 8 — '+(p===100?'Release bereit. Zeit, Feedback zu sammeln.':p<25?'Die richtigen Fragen finden.':p<50?'Aus Gedanken werden erste Entwürfe.':p<75?'Die Idee nimmt Form an.':'Prüfen, verfeinern, veröffentlichen.');q('advance').disabled=state.week>=8||p===100;document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('done',p>=i*25))}q('team').value=state.team;q('team').oninput=()=>{state.team=+q('team').value;draw();persist()};q('advance').onclick=()=>{state.week++;draw();persist()};q('reset').onclick=()=>{state.week=0;draw();persist()};draw();"}
else{html='<div class="eyebrow">DEMO / OFFENER GEDANKE</div><h2>Damit lässt sich<br><span class="accent">etwas anfangen.</span></h2><p>Dieser Prototyp antwortet bewusst ohne Sprachmodell. Probiere „Sparen“, „Vergleichen“ oder „Projekt planen“, um eine interaktive Antwort zu öffnen.</p><p class="small">Dein Text bleibt Text. Er wird niemals als HTML oder JavaScript ausgeführt.</p>';}
return {html,js}}
function frame(m){let f=document.createElement('iframe');f.className='render';f.title='Interaktive Demo: '+m.kind;f.setAttribute('sandbox','allow-scripts');f.setAttribute('referrerpolicy','no-referrer');f.setAttribute('allow',"camera 'none'; microphone 'none'; geolocation 'none'; clipboard-write 'none'");let channel=uid(),c=content(m),state=cleanState(m.kind,m.state);frames.set(f,{m,channel});let bridge="const channel="+JSON.stringify(channel)+";let state="+JSON.stringify(state)+";const q=id=>document.getElementById(id);const send=(type,payload)=>parent.postMessage({v:1,channel,type,...payload},'*');const persist=()=>send('state',{state});"+c.js+";let last=0;function size(){let height=Math.ceil(document.body.scrollHeight);if(height!==last){last=height;send('resize',{height})}}new ResizeObserver(size).observe(document.body);size();";f.srcdoc='<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;unsafe-inline&#39;; style-src &#39;unsafe-inline&#39;; img-src data:; connect-src &#39;none&#39;; form-action &#39;none&#39;; base-uri &#39;none&#39;; object-src &#39;none&#39;; frame-src &#39;none&#39;; navigate-to &#39;none&#39;"><style>'+sharedCSS+'</style></head><body><main>'+c.html+'</main><script>'+bridge+'</scr'+'ipt></body></html>';return f}
window.addEventListener('message',e=>{if(e.origin!=='null'||!e.data||typeof e.data!=='object')return;let entry=[...frames].find(([f])=>f.contentWindow===e.source);if(!entry)return;let [f,{m,channel}]=entry,d=e.data;if(d.v!==1||d.channel!==channel||typeof d.type!=='string')return;if(d.type==='resize'&&Number.isFinite(d.height)&&d.height>=100&&d.height<=2400)f.style.height=Math.ceil(d.height)+'px';if(d.type==='state'&&d.state&&typeof d.state==='object'){try{if(JSON.stringify(d.state).length<1024){m.state=cleanState(m.kind,d.state);save()}}catch{}}if(d.type==='suggest'&&typeof d.text==='string'&&d.text.length<=500){$('#prompt').value=d.text;$('#prompt').focus();toast('Vorschlag im Eingabefeld. Du entscheidest, ob du ihn sendest.')}});
function render(){frames.clear();$('#sessions').replaceChildren();for(let s of db.sessions){let b=document.createElement('button');b.textContent=s.title;b.setAttribute('aria-current',s.id===db.current);b.onclick=()=>{stop();db.current=s.id;save();render();$('#sidebar').classList.remove('open')};$('#sessions').append(b)}let feed=$('#feed');feed.innerHTML='<section class="intro"><svg class="orbit" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M10 20L80 9 92 80 20 92Z" stroke="currentColor"/><circle cx="50" cy="50" r="32" stroke="currentColor"/><path d="M8 70L88 30M30 5L70 95" stroke="currentColor" stroke-dasharray="3 5"/></svg><div class="eyebrow">Ein Gespräch. Unendlich viele Formen.</div><h1>Gedanken brauchen<br><em>keine Schubladen.</em></h1><p>Frag, erkunde, verändere. Hier werden Antworten zu kleinen Werkzeugen — direkt im Gespräch.</p><div class="starters"><button data-demo="Sparen berechnen">↗ Sparziel erkunden</button><button data-demo="Arbeitsorte vergleichen">◇ Orte vergleichen</button><button data-demo="Projekt planen">⌁ Projekt simulieren</button></div></section>';for(let m of current().messages){let el=document.createElement('article');el.className='message '+(m.role==='user'?'user':'assistant');if(m.role==='user'){let b=document.createElement('div');b.className='bubble';b.textContent=m.text;el.append(b)}else{el.innerHTML='<div class="byline"><span>⌑</span> FORM <small> / '+(m.kind==='error'?'FEHLER':'DEMO')+'</small></div>';if(['error','stopped'].includes(m.kind)){let n=document.createElement('div');n.className='notice '+(m.kind==='error'?'error':'');n.textContent=m.kind==='error'?'Demo-Fehler: Die Antwort konnte nicht erstellt werden. Dein Text ist gespeichert.':'Antwort gestoppt. Du kannst einen neuen Gedanken senden.';el.append(n);if(m.kind==='error'){let b=document.createElement('button');b.textContent='Plan-Demo ausprobieren';b.onclick=()=>sendPrompt('Projekt planen');el.append(b)}}else el.append(frame(m))}feed.append(el)}feed.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>sendPrompt(b.dataset.demo));}
function busy(on){$('#stop').classList.toggle('hidden',!on);$('#send').classList.toggle('hidden',on);$('#live').textContent=on?'Antwort wird vorbereitet':'Bereit'}
function stop(){if(!pending)return;clearTimeout(pending.timer);let s=db.sessions.find(s=>s.id===pending.session);s.messages.push({id:uid(),role:'assistant',kind:'stopped',state:{}});pending=null;busy(false);save();render()}
function sendPrompt(text){text=text.trim().slice(0,2000);if(!text||pending)return;if(current().messages.length>=98)return toast('Diese Sitzung ist voll. Starte einen neuen Gedankengang.');let s=current();s.messages.push({id:uid(),role:'user',text});if(s.messages.length===1)s.title=text.slice(0,45);$('#prompt').value='';save();render();let n=document.createElement('div');n.className='notice';n.textContent='⌑ Form denkt in Möglichkeiten …';n.setAttribute('role','status');$('#feed').append(n);$('#feed').scrollTop=$('#feed').scrollHeight;busy(true);let timer=setTimeout(()=>{let kind=/^(fehler|error)$/i.test(text)?'error':/spar|berechn|budget|calc/i.test(text)?'calc':/vergleich|ort|compar/i.test(text)?'compare':/plan|projekt|simulat/i.test(text)?'plan':'fallback';s.messages.push({id:uid(),role:'assistant',kind,state:cleanState(kind,{}),text});pending=null;busy(false);save();render();requestAnimationFrame(()=>{let els=$('#feed').querySelectorAll('article');els[els.length-1]?.scrollIntoView({block:'start'})})},650);pending={timer,session:s.id}}
$('#composer').onsubmit=e=>{e.preventDefault();sendPrompt($('#prompt').value)};$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendPrompt(e.target.value)}};$('#stop').onclick=stop;$('#new').onclick=newSession;$('#mobile').onclick=()=>{$('#sidebar').classList.toggle('open');$('#mobile').setAttribute('aria-expanded',$('#sidebar').classList.contains('open'))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#mobile').setAttribute('aria-expanded','false');if(pending)stop()}});
$('#export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='form-gespraeche.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Archiv exportiert')};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;if(file.size>1500000)throw Error('Datei zu gross (max. 1,5 MB)');let data=normalize(JSON.parse(await file.text()));if(db.sessions.length+data.sessions.length>40)throw Error('Maximal 40 Sitzungen');stop();for(let s of data.sessions){s.id=uid();s.messages.forEach(m=>m.id=uid());db.sessions.unshift(s)}db.current=db.sessions[0].id;save();render();toast('Archiv sicher importiert — bestehende Chats bleiben erhalten')}catch(err){toast('Import fehlgeschlagen: '+err.message)}e.target.value=''};
if(!db.sessions.length)newSession();else render();
</script></body></html>
